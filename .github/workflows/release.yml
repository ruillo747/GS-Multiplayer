name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Ensure version matches gradle.properties
        if: github.event_name == 'push'
        run: |
          GRADLE_VERSION="v$(grep -oP '^mod_version=\K.*' gradle.properties)"
          if [ "$GRADLE_VERSION" != "${{ steps.version.outputs.tag }}" ]; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} != gradle.properties ($GRADLE_VERSION)"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build mod
        run: ./gradlew build --no-daemon --stacktrace

      - name: Server tests
        run: |
          cd server
          npm install --no-audit --no-fund
          npm test

      - name: Prepare release notes
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          {
            echo "## GS Multiplayer $VERSION"
            echo ""
            echo "### Установка / Install"
            echo "1. Install the [Fabric Loader](https://fabricmc.net/use/installer/) for Minecraft **1.16.5**"
            echo "2. Drop \`gsmultiplayer-$VERSION.jar\` into \`.minecraft/mods/\`"
            echo "3. Launch the game with the Fabric profile"
            echo ""
            echo "### Server"
            echo "The signaling/relay server is optional for a quick test and required for playing over the internet."
            echo "See [docs/DEPLOY.md](https://github.com/${{ github.repository }}/blob/main/docs/DEPLOY.md)."
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: GS Multiplayer ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: |
            build/libs/gsmultiplayer-*.jar
          fail_on_unmatched_files: true
