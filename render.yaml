# One-click deploy blueprint: signaling server on Render (free tier).
# Relay (UDP) is not supported by Render's free plan - the mod will still work
# over direct P2P; deploy relay on a VPS when you need the fallback.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gs-signaling
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node signaling/index.js
    healthCheckPath: /health
    envVars:
      - key: SIGNALING_PORT
        value: 10000          # Render routes public traffic to the app port
      - key: RELAY_PORT
        value: 35501          # unused on Render (no UDP), kept for config parity
      - key: RELAY_SECRET
        generateValue: true
      - key: RELAY_PUBLIC_HOST
        sync: false           # set after deploy if you also run a relay elsewhere
      - key: MAX_PLAYERS
        value: 4
